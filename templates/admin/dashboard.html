{% extends "base.html" %}
{% block title %}Admin &middot; Add bus{% endblock %}
{% block content %}
<div class="panel" style="max-width:640px;">
  <h1>Add a bus</h1>
  <form method="post" action="{{ url_for('admin_add_bus') }}">
    <div class="grid-2">
      <div>
        <label for="name">Operator / company name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="bname">Bus name</label>
        <input type="text" id="bname" name="bname" required>
      </div>
    </div>
    <label for="address">Address</label>
    <textarea id="address" name="address" required></textarea>
    <div class="grid-2">
      <div>
        <label for="pnumber">Phone number</label>
        <input type="text" id="pnumber" name="pnumber" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
    </div>
    <div class="grid-2">
      <div>
        <label for="src">Source</label>
        <input type="text" id="src" name="src" required>
      </div>
      <div>
        <label for="des">Destination</label>
        <input type="text" id="des" name="des" required>
      </div>
    </div>
    <div class="grid-2">
      <div>
        <label for="price">Price (Rs.)</label>
        <input type="number" id="price" name="price" min="1" required>
      </div>
      <div>
        <label for="btype">Bus type</label>
        <select name="btype" id="btype">
          <option value="AC">AC</option>
          <option value="Non-AC">Non-AC</option>
        </select>
      </div>
    </div>
    <div class="grid-2">
      <div>
        <label for="stime">Start time</label>
        <input type="text" id="stime" name="stime" placeholder="e.g. 10:00 AM" required>
      </div>
      <div>
        <label for="atime">Arrival time</label>
        <input type="text" id="atime" name="atime" placeholder="e.g. 12:00 PM" required>
      </div>
    </div>
    <label for="stop">Stop (optional)</label>
    <input type="text" id="stop" name="stop">

    <button type="submit" name="btn" class="btn btn-amber" style="margin-top:16px;">Add bus</button>
  </form>
</div>

<div class="panel" style="max-width:640px;">
  <h1>Add an admin</h1>
  <form method="post" action="{{ url_for('admin_add_admin') }}">
    <div class="grid-2">
      <div>
        <label for="admin_uname">Admin username</label>
        <input type="text" id="admin_uname" name="admin_uname" required>
      </div>
      <div>
        <label for="admin_password">Admin password</label>
        <input type="password" id="admin_password" name="admin_password" required>
      </div>
    </div>
    <button type="submit" class="btn btn-amber" style="margin-top:16px;">Add admin</button>
  </form>

  {% if admins %}
  <div style="margin-top:22px;">
    <div class="panel-title">Current admins</div>
    <table class="data">
      <thead><tr><th>Username</th></tr></thead>
      <tbody>
        {% for a in admins %}
        <tr><td class="mono">{{ a.uname }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% endif %}
</div>
{% endblock %}
