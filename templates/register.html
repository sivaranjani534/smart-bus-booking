{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="panel" style="max-width:520px;margin:0 auto;">
  <h1>Create your account</h1>
  <form method="post" action="{{ url_for('register') }}">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required>

    <label>Gender</label>
    <div class="radio-row">
      <label><input type="radio" name="gender" value="Male" required> Male</label>
      <label><input type="radio" name="gender" value="Female"> Female</label>
    </div>

    <label for="address">Address</label>
    <textarea id="address" name="address" required></textarea>

    <label for="pnumber">Phone number</label>
    <input type="tel" id="pnumber" name="pnumber" required pattern="[6789][0-9]{9}"
           title="Should start with 6, 7, 8, or 9 and be 10 digits">

    <label for="email">Email address</label>
    <input type="email" id="email" name="email" required>

    <label for="uname">Username</label>
    <input type="text" id="uname" name="uname" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="4">

    <div style="margin-top:20px;">
      <button type="submit" class="btn btn-amber">Register</button>
      <a href="{{ url_for('index') }}" class="btn btn-outline" style="margin-left:8px;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
